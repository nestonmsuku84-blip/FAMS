<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review History - FAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="fas fa-graduation-cap me-2"></i>FAMS
            </a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="fas fa-tachometer-alt"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="pending-reviews.html">
                                <i class="fas fa-file-alt"></i> Pending Reviews
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="history.html">
                                <i class="fas fa-history"></i> Review History
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Review History</h1>
                    <span class="badge bg-info">All Reviews</span>
                </div>

                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-history me-2"></i>Your Review History
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Reference</th>
                                        <th>Student</th>
                                        <th>Decision</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="reviewHistoryTable"><tr><td colspan="5" class="text-center text-muted py-4">Loading review history…</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <a href="dashboard.html" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                    </a>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const body = document.getElementById('reviewHistoryTable');
            const escape = value => { const node = document.createElement('span'); node.textContent = value || '—'; return node.innerHTML; };
            try {
                const response = await fetch('../../api/dashboard-data.php?mode=history');
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to load review history.');
                const rows = data.review_history || [];
                body.innerHTML = rows.map(row => '<tr><td><strong>' + escape(row.reference_number) + '</strong></td><td>' + escape(row.student_name) + '</td><td class="text-capitalize">' + escape(row.decision.replace(/_/g, ' ')) + '</td><td>' + escape(row.completed_at) + '</td><td class="text-capitalize">' + escape(row.status) + '</td></tr>').join('') || '<tr><td colspan="5" class="text-center text-muted py-4">You have not completed any reviews.</td></tr>';
            } catch (error) { body.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Unable to load review history.</td></tr>'; }
        });
    </script>
</body>
</html>
