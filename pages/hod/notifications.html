<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications - FAMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../../css/style.css"></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="dashboard.html"><i class="fas fa-graduation-cap me-2"></i>FAMS</a><a class="btn btn-light btn-sm" href="../../api/logout.php">Logout</a></div></nav><div class="container-fluid"><div class="row"><nav class="col-md-3 col-lg-2 d-md-block sidebar"><div class="position-sticky pt-3"><ul class="nav flex-column"></ul></div></nav><main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Notifications</h1><p class="text-muted mb-0">Application and system updates.</p></div><button id="markAllRead" class="btn btn-outline-primary">Mark all as read</button></div><div class="card"><div class="list-group list-group-flush" id="notificationList"><div class="list-group-item text-muted">Loading notifications…</div></div></div></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="../../js/script.js"></script><script>document.addEventListener('DOMContentLoaded',function(){const list=document.getElementById('notificationList'),all=document.getElementById('markAllRead'),esc=v=>{const e=document.createElement('span');e.textContent=v||'';return e.innerHTML};const load=async()=>{try{const r=await fetch('../../api/notifications.php'),d=await r.json();if(!r.ok)throw Error(d.error);all.disabled=!d.unread_count;list.innerHTML=d.notifications.map(n=>'<div class="list-group-item '+(Number(n.is_read)?'':'bg-light')+'"><strong>'+esc(n.subject||'FAMS update')+'</strong><p class="mb-1">'+esc(n.message)+'</p><small class="text-muted">'+new Date(n.created_at.replace(' ','T')).toLocaleString()+'</small></div>').join('')||'<div class="list-group-item text-muted">No notifications.</div>'}catch(e){list.innerHTML='<div class="list-group-item text-danger">'+esc(e.message)+'</div>'}};all.onclick=async()=>{await fetch('../../api/notifications.php',{method:'POST',body:new URLSearchParams({action:'read_all'})});load()};load()});</script></body></html>
