<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - FAMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="dashboard.html"><i class="fas fa-graduation-cap me-2"></i>FAMS Admin</a><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="../../api/logout.php"><i class="fas fa-sign-out-alt me-1"></i>Logout</a></li></ul></div></nav>
<div class="container-fluid"><div class="row">
    <nav class="col-md-3 col-lg-2 d-md-block sidebar"><div class="position-sticky pt-3"><ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="users.html"><i class="fas fa-users"></i>Users</a></li>
        <li class="nav-item"><a class="nav-link" href="institutions.html"><i class="fas fa-university"></i>Institution</a></li>
        <li class="nav-item"><a class="nav-link" href="specializations.html"><i class="fas fa-tag"></i>Departments</a></li>
        <li class="nav-item"><a class="nav-link" href="application-windows.html"><i class="fas fa-calendar-alt"></i>Application Windows</a></li>
        <li class="nav-item"><a class="nav-link active" href="notifications.html"><i class="fas fa-bell"></i>Notifications</a></li>
    </ul></div></nav>
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div class="pt-3 pb-2 mb-3 border-bottom"><h1 class="h2">Notifications</h1><p class="text-muted mb-0">Send an in-system announcement to all active users or one person.</p></div>
        <div class="row g-4"><div class="col-lg-5"><div class="card"><div class="card-body"><h5 class="card-title">New announcement</h5><form id="noticeForm"><div class="mb-3"><label class="form-label">Recipient</label><select class="form-select" name="recipient_id" id="recipient"><option value="all">All active users</option></select></div><div class="mb-3"><label class="form-label">Subject</label><input class="form-control" name="subject" maxlength="150" required></div><div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" name="message" rows="5" required></textarea></div><button class="btn btn-primary"><i class="fas fa-paper-plane me-2"></i>Send notification</button></form></div></div></div>
        <div class="col-lg-7"><div class="card"><div class="card-header"><i class="fas fa-history me-2"></i>Recent deliveries</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Subject</th><th>Recipient</th><th>Sent</th></tr></thead><tbody id="notificationList"></tbody></table></div></div></div></div>
        <div class="card mt-4"><div class="card-header d-flex justify-content-between align-items-center"><span><i class="fas fa-inbox me-2"></i>My inbox</span><button id="markAllRead" class="btn btn-sm btn-outline-primary">Mark all as read</button></div><div id="myNotificationList" class="list-group list-group-flush"><div class="list-group-item text-muted">Loading notifications…</div></div></div>
    </main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="../../js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
 const form=document.getElementById('noticeForm'), recipient=document.getElementById('recipient'), list=document.getElementById('notificationList'), myList=document.getElementById('myNotificationList'), markAll=document.getElementById('markAllRead');
 const esc=v=>{const e=document.createElement('span');e.textContent=v||'';return e.innerHTML};
 function load(){Promise.all([fetch('../../api/admin-data.php?resource=notification_recipients').then(r=>r.json()),fetch('../../api/admin-data.php?resource=admin_notifications').then(r=>r.json()),fetch('../../api/notifications.php').then(r=>r.json())]).then(([users,notices,inbox])=>{recipient.innerHTML='<option value="all">All active users</option>'+users.items.map(u=>'<option value="'+u.id+'">'+esc(u.full_name)+' — '+esc(u.email)+'</option>').join(''); list.innerHTML=notices.items.map(n=>'<tr><td><strong>'+esc(n.subject)+'</strong><div class="small text-muted">'+esc(n.message)+'</div></td><td>'+esc(n.recipient_name)+'</td><td class="small">'+esc(n.created_at)+'</td></tr>').join('')||'<tr><td colspan="3" class="text-center text-muted py-4">No notifications sent yet.</td></tr>';markAll.disabled=!inbox.unread_count;myList.innerHTML=inbox.notifications.map(n=>'<div class="list-group-item '+(Number(n.is_read)?'':'bg-light')+'"><strong>'+esc(n.subject||'FAMS update')+'</strong><p class="mb-1">'+esc(n.message)+'</p><small class="text-muted">'+esc(n.created_at)+'</small></div>').join('')||'<div class="list-group-item text-muted">No notifications.</div>';}).catch(()=>{list.innerHTML='<tr><td colspan="3" class="text-danger p-3">Unable to load notifications.</td></tr>';myList.innerHTML='<div class="list-group-item text-danger">Unable to load your notifications.</div>';})}
 form.addEventListener('submit',e=>{e.preventDefault();if(!form.checkValidity()){form.classList.add('was-validated');return}fetch('../../api/admin-data.php?resource=notifications',{method:'POST',body:new URLSearchParams(new FormData(form))}).then(r=>r.json().then(d=>{if(!r.ok)throw Error(d.error);return d})).then(d=>{showToast(d.message,'success');form.reset();load()}).catch(e=>showToast(e.message,'danger'))});markAll.addEventListener('click',()=>fetch('../../api/notifications.php',{method:'POST',body:new URLSearchParams({action:'read_all'})}).then(load));load();
});
</script></body></html>
