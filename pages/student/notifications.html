<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - FAMS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="hold-transition sidebar-mini">
    <div class="wrapper">
        <!-- Content Wrapper -->
        <div class="content-wrapper">
            <section class="content-header">
                <div class="container-fluid">
                    <div class="row mb-2">
                        <div class="col-12">
                            <h1 class="m-0">Notifications</h1>
                        </div>
                    </div>
                </div>
            </section>

            <section class="content">
                <div class="container-fluid">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <p class="text-muted mb-0">Updates about your applications and placement.</p>
                        <button id="markAllRead" class="btn btn-outline-primary btn-sm">Mark all as read</button>
                    </div>
                    <div class="card">
                        <div class="list-group list-group-flush" id="notificationList">
                            <div class="list-group-item text-muted">Loading notifications…</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer text-center">
            <strong>FAMS</strong>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="../../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const list = document.getElementById('notificationList');
            const markAll = document.getElementById('markAllRead');
            const escape = function(value) { 
                const node = document.createElement('span'); 
                node.textContent = value || ''; 
                return node.innerHTML; 
            };

            const load = async function() {
                try {
                    const response = await fetch('../../api/notifications.php');
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Unable to load notifications.');
                    markAll.disabled = data.unread_count === 0;
                    list.innerHTML = data.notifications.map(function(item) {
                        const target = item.type === 'placement_assigned' ? 'placement.html' : (item.application_id ? 'application-detail.html?id=' + item.application_id : '#');
                        const actionLabel = item.type === 'placement_assigned' ? 'View placement' : 'View application';
                        return '<div class="list-group-item ' + (Number(item.is_read) ? '' : 'bg-light') + '"><div class="d-flex justify-content-between gap-3"><div><h5 class="mb-1">' + escape(item.subject || 'FAMS update') + '</h5><p class="mb-1">' + escape(item.message) + '</p><small class="text-muted">' + new Date(item.created_at.replace(' ', 'T')).toLocaleString() + '</small></div><div class="text-nowrap">' + ((item.application_id || item.type === 'placement_assigned') ? '<a class="btn btn-sm btn-outline-primary me-1" href="' + target + '">' + actionLabel + '</a>' : '') + (!Number(item.is_read) ? '<button class="btn btn-sm btn-outline-secondary mark-read" data-id="' + item.id + '">Mark read</button>' : '') + '</div></div></div>';
                    }).join('') || '<div class="list-group-item text-center text-muted py-4">You have no notifications.</div>';
                    
                    list.querySelectorAll('.mark-read').forEach(function(button) { 
                        button.addEventListener('click', function() { update('read', button.dataset.id); }); 
                    });
                } catch (error) { 
                    list.innerHTML = '<div class="list-group-item text-danger">' + escape(error.message) + '</div>'; 
                }
            };

            const update = async function(action, id) {
                try {
                    const form = new URLSearchParams({ action: action });
                    if (id) form.set('id', id);
                    const response = await fetch('../../api/notifications.php', { method: 'POST', body: form });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Unable to update notifications.');
                    load();
                } catch (error) { 
                    if (typeof showToast === 'function') showToast(error.message, 'danger'); 
                }
            };

            markAll.addEventListener('click', function() { update('read_all'); });
            load();
        });
    </script>
</body>
</html>
