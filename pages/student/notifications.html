<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - FAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="dashboard.html"><i class="fas fa-graduation-cap me-2"></i>FAMS</a><a class="btn btn-light btn-sm" href="../../api/logout.php">Logout</a></div></nav>
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div><h1 class="h2 mb-1">Notifications</h1><p class="text-muted mb-0">Updates about your applications and placement.</p></div>
            <div class="d-flex gap-2"><button id="markAllRead" class="btn btn-outline-primary">Mark all as read</button><a href="dashboard.html" class="btn btn-outline-secondary">Dashboard</a></div>
        </div>
        <div class="card"><div class="list-group list-group-flush" id="notificationList"><div class="list-group-item text-muted">Loading notifications…</div></div></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const list = document.getElementById('notificationList');
            const markAll = document.getElementById('markAllRead');
            const escape = function(value) { const node = document.createElement('span'); node.textContent = value || ''; return node.innerHTML; };
            const load = async function() {
                try {
                    const response = await fetch('../../api/notifications.php');
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Unable to load notifications.');
                    markAll.disabled = data.unread_count === 0;
                    list.innerHTML = data.notifications.map(function(item) {
                        const target = item.application_id ? 'application-detail.html?id=' + item.application_id : '#';
                        return '<div class="list-group-item ' + (Number(item.is_read) ? '' : 'bg-light') + '"><div class="d-flex justify-content-between gap-3"><div><h5 class="mb-1">' + escape(item.subject || 'FAMS update') + '</h5><p class="mb-1">' + escape(item.message) + '</p><small class="text-muted">' + new Date(item.created_at.replace(' ', 'T')).toLocaleString() + '</small></div><div class="text-nowrap">' + (item.application_id ? '<a class="btn btn-sm btn-outline-primary" href="' + target + '">View application</a>' : '') + (!Number(item.is_read) ? ' <button class="btn btn-sm btn-outline-secondary mark-read" data-id="' + item.id + '">Mark read</button>' : '') + '</div></div></div>';
                    }).join('') || '<div class="list-group-item text-center text-muted py-4">You have no notifications.</div>';
                    list.querySelectorAll('.mark-read').forEach(function(button) { button.addEventListener('click', function() { update('read', button.dataset.id); }); });
                } catch (error) { list.innerHTML = '<div class="list-group-item text-danger">' + escape(error.message) + '</div>'; }
            };
            const update = async function(action, id) {
                try {
                    const form = new URLSearchParams({ action: action });
                    if (id) form.set('id', id);
                    const response = await fetch('../../api/notifications.php', { method: 'POST', body: form });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Unable to update notifications.');
                    load();
                } catch (error) { showToast(error.message, 'danger'); }
            };
            markAll.addEventListener('click', function() { update('read_all'); });
            load();
        });
    </script>
</body>
</html>
