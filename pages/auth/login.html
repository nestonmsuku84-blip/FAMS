<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FAMS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <!-- FIXED: Goes back to root index.html -->
            <a href="../../index.html">
                <i class="fas fa-graduation-cap me-2"></i>
                <b>FAMS</b>
            </a>
        </div>
        
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Sign in to your account</p>

                <!-- FIXED: Form action goes to student dashboard by default -->
                <form action="../../api/login.php" method="POST">
                    <div class="input-group mb-3">
                        <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                        <div class="input-group-append">
                            <span class="input-group-text">
                                <i class="fas fa-envelope"></i>
                            </span>
                        </div>
                    </div>
                    
                    <div class="input-group mb-3">
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                        <div class="input-group-append">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-8">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                        </div>
                        <div class="col-4">
                            <!-- FIXED: Button goes to student dashboard -->
                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </div>
                    </div>
                </form>

                <div class="mt-3 text-center">
                    <p class="mb-1">
                        <a href="forgot-password.html">Forgot Password?</a>
                    </p>
                    <p class="mb-0">
                        Don't have an account? 
                        <a href="register.html" class="text-center">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/script.js"></script>
</body>
</html>
