<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications - FAMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="dashboard.html"><i class="fas fa-graduation-cap me-2"></i>FAMS</a><a class="btn btn-light btn-sm" href="../../api/logout.php">Logout</a></div></nav>
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Notifications</h1><p class="text-muted mb-0">Your placement and system updates.</p></div><div class="d-flex gap-2"><button id="markAllRead" class="btn btn-outline-primary">Mark all as read</button><a href="dashboard.html" class="btn btn-outline-secondary">Dashboard</a></div></div>
        <div class="card"><div id="notificationList" class="list-group list-group-flush"><div class="list-group-item text-muted">Loading notifications…</div></div></div>
    </main>
    <script src="../../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const list = document.getElementById('notificationList');
            const markAll = document.getElementById('markAllRead');
            const escape = value => { const node = document.createElement('span'); node.textContent = value || ''; return node.innerHTML; };
            const load = async () => {
                try {
                    const response = await fetch('../../api/notifications.php');
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Unable to load notifications.');
                    markAll.disabled = !data.unread_count;
                    list.innerHTML = data.notifications.map(item => '<div class="list-group-item ' + (Number(item.is_read) ? '' : 'bg-light') + '"><strong>' + escape(item.subject || 'FAMS update') + '</strong><p class="mb-1">' + escape(item.message) + '</p><small class="text-muted">' + new Date(item.created_at.replace(' ', 'T')).toLocaleString() + '</small></div>').join('') || '<div class="list-group-item text-muted">No notifications.</div>';
                } catch (error) { list.innerHTML = '<div class="list-group-item text-danger">' + escape(error.message) + '</div>'; }
            };
            markAll.addEventListener('click', async () => { await fetch('../../api/notifications.php', { method: 'POST', body: new URLSearchParams({ action: 'read_all' }) }); load(); });
            load();
        });
    </script>
</body>
</html>
